		<select name="dictselector" id="dictselector">
			<option value="en">Galatac &ndash; English</option>
		</select>

		<input type="checkbox" id="search_nat" checked><label for="search_nat"> Sai en <span class="natlang_lower">English</span></label>

		<div id="noresults">Nil penlose</div>

		<table class="results_table" id="results_nat">
			<tr><th colspan="5"><span class="natlang">English</span> &ShortRightArrow; Galatac</th></tr>
			<tr>
				<th><span class="natlang">Galatac</span></th>
				<th>Galatac</th>
				<th>Part of Speech</th>
				<th>Source</th>
				<th>Notes</th>
			</tr>
			<tr><td></td><td></td><td></td><td></td><td></td></tr>
		</table>
